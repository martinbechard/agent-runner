[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-report"
version = "0.8.0"
description = "Generate privacy-safe execution reports for agent runs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.0,<4", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["pyinstaller==6.21.0"]

[project.scripts]
agent-report = "agent_report.cli:main"
mcp-agent-report = "agent_report.mcp_server:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_report*"]

[tool.setuptools.data-files]
"share/agent-report" = [
    "scripts/run-timeline.py",
    "tool-formatters.json",
    "../../docs/reference/openai-model-pricing.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Release Agent Report wheels

on:
  push:
    tags:
      - "agent-report-v*"

permissions:
  contents: read

concurrency:
  group: release-agent-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheel:
    name: Build ${{ matrix.platform }} wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate release tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, pathlib, tomllib;
          version=tomllib.loads(pathlib.Path('tools/report/pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          expected=f'agent-report-v{version}';
          actual=os.environ['RELEASE_TAG'];
          assert actual == expected, f'release tag {actual!r} does not match {expected!r}';
          print(f'Validated {expected}')"

      - name: Install build and test dependencies
        run: python -m pip install --upgrade build pytest

      - name: Select stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build platform wheel with bundled Rust engine
        run: python -m build --wheel --outdir wheelhouse tools/report

      - name: Verify release wheel payload
        run: >-
          python tools/report/scripts/verify_release_wheel.py wheelhouse
          --expected-version "${{ github.ref_name }}"

      - name: Install built wheel
        run: >-
          python -c "from pathlib import Path; import subprocess, sys;
          wheel=next(Path('wheelhouse').glob('*.whl'));
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)])"

      - name: Run report regression tests against installed package
        run: python -m pytest tools/report/tests -q

      - name: Upload verified wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-report-wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    needs: build-wheel
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-report-wheel-*
          path: dist
          merge-multiple: true

      - name: Verify complete release set
        run: >-
          python -c "from pathlib import Path;
          wheels=sorted(Path('dist').glob('*.whl'));
          assert len(wheels) == 3, f'expected 3 wheels, found {len(wheels)}: {wheels}';
          assert len({wheel.name for wheel in wheels}) == 3, f'duplicate wheel names: {wheels}';
          print(*wheels, sep='\n')"

      - name: Generate SHA-256 checksums
        run: cd dist && sha256sum *.whl > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#agent-report-v}"
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS \
            --verify-tag \
            --title "Agent Report $version" \
            --generate-notes \
            --latest
